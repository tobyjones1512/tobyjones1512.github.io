<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – Filmmakers Kit | Toby Jones</title>
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1d1d1f; background: #f5f5f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 640px; width: 100%; padding: 20px; text-align: center; }
        .card { background: #fff; border-radius: 20px; padding: 60px 40px; box-shadow: 0 8px 32px rgba(0,0,0,0.09); }
        .checkmark { width: 80px; height: 80px; margin: 0 auto 24px; background: #e6f4ed; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .checkmark svg { color: #1a7f4b; }
        h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
        .subtitle { color: #86868b; font-size: 17px; margin-bottom: 32px; line-height: 1.5; }

        .key-block { background: #f5f5f7; border: 1.5px solid #d2d2d7; border-radius: 14px; padding: 24px; margin-bottom: 32px; }
        .key-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #86868b; margin-bottom: 10px; }
        .key-value { font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #1d1d1f; margin-bottom: 14px; word-break: break-all; }
        .copy-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: #1d1d1f; color: #fff; border: none; border-radius: 980px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .copy-btn:hover { background: #333; }
        .copy-btn.copied { background: #1a7f4b; }
        .key-hint { font-size: 13px; color: #86868b; margin-top: 12px; line-height: 1.4; }
        .kit-note { font-size: 13px; font-weight: 600; color: #0071e3; margin-top: 6px; }

        .downloads { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .download-btn { display: inline-block; padding: 15px 28px; background: #0071e3; color: #fff; font-size: 16px; font-weight: 600; border-radius: 980px; text-decoration: none; transition: all 0.2s; box-shadow: 0 4px 12px rgba(0,113,227,0.3); }
        .download-btn:hover { background: #0077ed; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,113,227,0.4); }
        .back-link { display: block; color: #86868b; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #0071e3; }

        .no-key-note { background: #fff8e7; border: 1px solid #ffd04a; border-radius: 10px; padding: 14px 18px; font-size: 14px; color: #6d4c00; margin-bottom: 28px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="checkmark">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <h1>Thank You!</h1>
            <p class="subtitle">Your purchase of Filmmakers Kit was successful.</p>

<p class="subtitle" style="margin-top:8px;">Your download links have been sent to your email — check your inbox.</p>
            <a href="/software/" class="back-link">← Back to Software</a>
        </div>
    </div>

    <script></script>
</body>
</html>
