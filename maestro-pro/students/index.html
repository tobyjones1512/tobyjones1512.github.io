<main id="main" class="plain">
<h1>Maestro Pro for Students</h1>
<form id="f" style="width:340px;height:330px;border:1px solid #000;padding:12px;overflow:hidden">
  <p><label>Name<br><input name="name" required></label></p>
  <p><label>Email<br><input name="email" type="email" required></label></p>
  <p>How would you like to pay?</p>
  <p><label><input type="radio" name="plan" value="yearly" required> &pound;48 per year</label></p>
  <p><label><input type="radio" name="plan" value="monthly"> &pound;6 per month (12-month contract)</label></p>
  <p><button type="submit">Continue</button></p>
</form>
</main>
<footer class="foot">
  <nav aria-label="Footer"><a href="../index.html">Maestro Pro</a><a href="../guide/index.html">Guide</a><a href="../education.html">For Education</a><a href="../support.html">Support</a><a href="../privacy.html">Privacy</a><a href="https://thecaffeinemediacompany.com/">Caffeine Media</a><a href="https://www.linkedin.com/in/toby-r-jones" rel="me noopener" target="_blank">LinkedIn</a></nav>

</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear()</script>
<script src="../assets/nav.js" defer></script>
<script>
// Redirect targets.
var URLS = {
  yearly: "https://pay.gocardless.com/BRT01M6NWC7RKKBJTJ5Z5Y4J36HSM",
  monthly: "https://app.opensignlabs.com/publicsign?templateid=fBYcSXw1iG"
};
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var url = URLS[this.plan.value];
  if (url) location.href = url;
});
</script>
