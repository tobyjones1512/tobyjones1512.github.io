name: Inject secrets & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Replace placeholder tokens in the purchase page with real values from
      # GitHub Secrets.  The API Login ID and Client Key are Authorize.net's
      # public-facing client credentials (designed for browser use with
      # Accept.js).  The secret Transaction Key lives only in the backend's
      # environment variables and is NEVER written here.
      - name: Inject Authorize.net credentials
        env:
          API_LOGIN_ID: ${{ secrets.AUTHORIZENET_API_LOGIN_ID }}
          CLIENT_KEY:   ${{ secrets.AUTHORIZENET_CLIENT_KEY }}
          CHARGE_URL:   ${{ secrets.CHARGE_URL }}
        run: |
          PURCHASE="software/IPTV Manager/purchase/index.html"
          COFFEE="buy-me-a-coffee/index.html"
          sed -i "s|__AUTHORIZENET_API_LOGIN_ID__|${API_LOGIN_ID}|g" "$PURCHASE"
          sed -i "s|__AUTHORIZENET_CLIENT_KEY__|${CLIENT_KEY}|g"     "$PURCHASE"
          sed -i "s|__CHARGE_URL__|${CHARGE_URL}|g"                  "$PURCHASE"
          sed -i "s|__AUTHORIZENET_API_LOGIN_ID__|${API_LOGIN_ID}|g" "$COFFEE"
          sed -i "s|__AUTHORIZENET_CLIENT_KEY__|${CLIENT_KEY}|g"     "$COFFEE"
          sed -i "s|__CHARGE_URL__|${CHARGE_URL}|g"                  "$COFFEE"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
