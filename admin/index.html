<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Email admin - Caffeine Media</title>
<meta name="theme-color" content="#16110E">
<link rel="icon" href="https://thecaffeinemediacompany.com/assets/favicon.png" type="image/png">
<style>
:root{--ink:#16110E;--paper:#FAFAF7;--field:#F2B705;--red:#C8211A;--dim:#55504B;--rule:#D9D6CE;--card:#FFFFFF;--soft:#F0EDE6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a{color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--paper),var(--soft))}
.login form{width:min(400px,100%);background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(22,17,14,.08)}
.login h1{font:800 1.9rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
.login .sub{color:var(--dim);margin:0 0 4px;font-size:.95rem}
.field{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:11px 13px;margin-bottom:2px;transition:border-color .15s}
.field:focus{border-color:var(--ink);outline:none}
.btn{background:var(--ink);color:var(--field);border:0;border-radius:999px;padding:12px 24px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn--sm{padding:8px 16px;font-size:.9rem}
.status{min-height:1.4em;margin:6px 0 0;font-weight:600;font-size:.9rem}
.status.ok{color:#1f6b3a}
.status.err{color:var(--red)}
.app{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.topbar h1{font:800 1.7rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
.topbar .meta{color:var(--dim);font-size:.9rem;margin-top:4px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:22px 24px;box-shadow:0 4px 20px rgba(22,17,14,.04)}
.card h2{font:800 1.05rem/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 16px;color:var(--dim)}
label{display:block;font:650 .75rem/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;color:var(--dim)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.row{grid-template-columns:1fr}}
textarea.field{min-height:260px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.95rem;line-height:1.5}
.hint{font-size:.8rem;color:var(--dim);margin:-4px 0 12px}
.preview{background:var(--soft);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-height:200px;font-size:.95rem;line-height:1.6}
.preview h3{font:800 1.1rem/1.2 Georgia,serif;margin:0 0 10px}
.preview p{margin:0 0 12px}
.preview ul{margin:0 0 12px;padding-left:20px}
.preview li{margin:3px 0}
.preview strong{font-weight:700}
.preview a{color:var(--red);font-weight:700;text-decoration:underline}
.preview .btnp{display:inline-block;background:var(--field);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:700;text-decoration:none;margin:8px 0}
.preview .foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);font-size:.8rem;color:var(--dim)}
.toggle{display:flex;gap:8px;margin-bottom:12px}
.toggle button{background:transparent;border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--dim)}
.toggle button.active{background:var(--ink);color:var(--field);border-color:var(--ink)}
</style>
</head>
<body>

<div id="login" class="login">
  <form id="loginForm">
    <h1>Email admin</h1>
    <p class="sub">The Caffeine Media Company</p>
    <label for="pw">Admin password</label>
    <input class="field" type="password" id="pw" autocomplete="current-password" required placeholder="Enter password">
    <button class="btn" type="submit">Sign in</button>
    <p id="loginStatus" class="status err"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="app">
    <div class="topbar">
      <div>
        <h1>Send email</h1>
        <div class="meta">HTML emails via the Caffeine Media mail system</div>
      </div>
      <button class="btn btn--ghost btn--sm" id="signOut" type="button" onclick="doSignOut()">Sign out</button>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Compose</h2>
        <form id="compose" novalidate>
          <label for="from">From</label>
          <select class="field" id="from">
            <option value="hello@thecaffeinemediacompany.com">hello@thecaffeinemediacompany.com</option>
            <option value="toby@thecaffeinemediacompany.com">toby@thecaffeinemediacompany.com</option>
            <option value="noreply@thecaffeinemediacompany.com">noreply@thecaffeinemediacompany.com</option>
          </select>

          <div class="row">
            <div>
              <label for="to">To</label>
              <input class="field" type="email" id="to" required placeholder="recipient@example.com">
            </div>
            <div>
              <label for="name">Recipient name</label>
              <input class="field" type="text" id="name" placeholder="there">
            </div>
          </div>

          <label for="subject">Subject</label>
          <input class="field" type="text" id="subject" required maxlength="200">

          <label for="body">Message</label>
          <p class="hint">Supports **bold**, lines starting with "- " for bullets, and [text](https://url) for links.</p>
          <textarea class="field" id="body" required placeholder="Hi there,&#10;&#10;Your message here."></textarea>

          <div class="row">
            <div>
              <label for="buttonLabel">Button label (optional)</label>
              <input class="field" type="text" id="buttonLabel" placeholder="Read more" maxlength="60">
            </div>
            <div>
              <label for="buttonUrl">Button URL (optional)</label>
              <input class="field" type="url" id="buttonUrl" placeholder="https://...">
            </div>
          </div>

          <label for="label">Email label (optional)</label>
          <input class="field" type="text" id="label" placeholder="Caffeine Media" maxlength="60">

          <button class="btn" id="send" type="submit">Send email</button>
          <p id="status" class="status"></p>
        </form>
      </div>

      <div class="card">
        <h2>Preview</h2>
        <div id="preview" class="preview"></div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://maestro-marketplace-api.vercel.app/api/marketplace-admin-email";
const KEY_STORAGE = "cm_admin_key";
let adminKey = null;

function doSignOut(){
  try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {}
  adminKey = null;
  location.reload();
}

function $(id){return document.getElementById(id);}

function showApp(){
  const login = $("login");
  if (login) login.remove();
  $("app").hidden = false;
}

let stored = null;
try { stored = sessionStorage.getItem(KEY_STORAGE); } catch (e) { stored = null; }
if (stored) { adminKey = stored; showApp(); }

window.addEventListener("pageshow", function(e){ if (e.persisted) location.reload(); });

$("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const pw = $("pw").value;
  if (!pw) return;
  try { sessionStorage.setItem(KEY_STORAGE, pw); } catch (e) {}
  adminKey = pw;
  $("loginStatus").textContent = "";
  showApp();
});

$("signOut").addEventListener("click", doSignOut);

function renderInline(t){
  return String(t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?![*])/g,"$1<em>$2</em>")
    .replace(/_([^_\n]+)_/g,"<em>$1</em>")
    .replace(/\[([^\]]+)\]\s*\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderPreview(){
  const body = $("body").value;
  const btnLabel = $("buttonLabel").value.trim();
  const btnUrl = $("buttonUrl").value.trim();
  const label = $("label").value.trim() || "Caffeine Media";
  const from = $("from").value;
  const name = $("name").value.trim() || "there";
  let html = '<h3>Caffeine Media</h3>';
  html += '<p style="font-weight:700;font-size:1.1rem;margin:0 0 12px">Hi ' + name + ',</p>';
  const lines = body.split("\n");
  let inList = false;
  for (const raw of lines){
    const line = raw.trim();
    if (!line){ if (inList){ html += '</ul>'; inList=false; } continue; }
    const m = /^[-*]\s+(.*)$/.exec(line);
    if (m){ if (!inList){ html += '<ul>'; inList=true; } html += '<li>'+renderInline(m[1])+'</li>'; }
    else { if (inList){ html += '</ul>'; inList=false; } html += '<p>'+renderInline(line)+'</p>'; }
  }
  if (inList) html += '</ul>';
  if (btnLabel && btnUrl) html += '<p><a class="btnp" href="'+btnUrl+'" target="_blank" rel="noopener noreferrer">'+btnLabel+'</a></p>';
  const signoff = from === "toby@thecaffeinemediacompany.com" ? "Toby Jones" : "The Caffeine Media Company";
  html += '<p style="margin-top:16px">Best regards,<br><strong>'+signoff+'</strong></p>';
  if (from === "noreply@thecaffeinemediacompany.com") html += '<div class="foot">This mailbox is not monitored.</div>';
  else html += '<div class="foot">The Caffeine Media Company &middot; thecaffeinemediacompany.com &middot; '+label+'</div>';
  $("preview").innerHTML = html;
}

// Open preview links in a new tab without navigating away
$("preview").addEventListener("click", function(e){
  const a = e.target && e.target.closest ? e.target.closest("a") : null;
  if (a && a.href){ e.preventDefault(); window.open(a.href, "_blank", "noopener,noreferrer"); }
});

["body","buttonLabel","buttonUrl","label","from","name"].forEach(function(id){
  const el = $(id);
  if (el) { el.addEventListener("input", renderPreview); el.addEventListener("change", renderPreview); }
});
renderPreview();

$("compose").addEventListener("submit", async function(e){
  e.preventDefault();
  const key = adminKey || (function(){try{return sessionStorage.getItem(KEY_STORAGE);}catch(e){return null;}})();
  const btn = $("send");
  const status = $("status");
  btn.disabled = true;
  status.className = "status";
  status.textContent = "Sending...";
  const payload = {
    key: key,
    from: $("from").value,
    to: $("to").value.trim(),
    name: $("name").value.trim(),
    subject: $("subject").value.trim(),
    body: $("body").value,
    label: $("label").value.trim(),
    buttonLabel: $("buttonLabel").value.trim(),
    buttonUrl: $("buttonUrl").value.trim()
  };
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Key": key || "" },
      body: JSON.stringify(payload)
    });
    const j = await r.json().catch(function(){return {};});
    if (!r.ok) throw new Error(j.error || ("Couldn't send (" + r.status + ")."));
    status.className = "status ok";
    status.textContent = "Sent.";
    $("compose").reset();
    renderPreview();
  } catch (err) {
    status.className = "status err";
    status.textContent = err.message || "Couldn't send.";
    if (/unauthor/i.test(err.message || "")) {
      try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {}
      adminKey = null;
      location.reload();
    }
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
