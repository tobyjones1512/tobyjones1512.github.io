<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Email admin - The Caffeine Media Company</title>
<meta name="theme-color" content="#16110E">
<link rel="icon" href="https://thecaffeinemediacompany.com/assets/favicon.png" type="image/png">
<style>
:root{--ink:#16110E;--paper:#FAFAF7;--field:#F2B705;--red:#C8211A;--dim:#55504B;--rule:#D9D6CE;--foot:#F0EDE6;--card:#FFFFFF}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px}
h1{font:800 1.6rem/1.1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--dim);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;margin-bottom:18px}
label{display:block;font:650 .8rem/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;color:var(--dim)}
.field{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:14px}
.field:focus{border-color:var(--ink);outline:none}
textarea.field{min-height:220px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.95rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.row{grid-template-columns:1fr}}
.btn{background:var(--ink);color:var(--field);border:0;border-radius:999px;padding:11px 22px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.status{min-height:1.4em;margin:10px 0 0;font-weight:600}
.status.ok{color:#1f6b3a}
.status.err{color:var(--red)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);display:grid;gap:14px}
.login h1{font-size:1.8rem}
.hint{font-size:.85rem;color:var(--dim);margin:-8px 0 14px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.topbar h1{margin:0}
.pill{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
</style>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm">
    <h1>Email admin</h1>
    <p class="sub">The Caffeine Media Company</p>
    <label for="pw">Admin password</label>
    <input class="field" type="password" id="pw" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign in</button>
    <p id="loginStatus" class="status err"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="wrap">
    <div class="topbar">
      <h1>Send email</h1>
      <button class="btn btn--ghost" id="signOut" type="button">Sign out</button>
    </div>
    <p class="sub">Sends an HTML email through the Caffeine Media mail system. Body supports <strong>**bold**</strong>, lines starting with <strong>- </strong> for bullets, and <strong>[text](https://url)</strong> for links.</p>

    <form id="compose" class="card" novalidate>
      <label for="from">From</label>
      <select class="field" id="from">
        <option value="hello@thecaffeinemediacompany.com">hello@thecaffeinemediacompany.com (Caffeine Media)</option>
        <option value="toby@thecaffeinemediacompany.com">toby@thecaffeinemediacompany.com (Toby Jones)</option>
        <option value="noreply@thecaffeinemediacompany.com">noreply@thecaffeinemediacompany.com (Caffeine Media)</option>
      </select>

      <div class="row">
        <div>
          <label for="to">To</label>
          <input class="field" type="email" id="to" required placeholder="recipient@example.com">
        </div>
        <div>
          <label for="name">Recipient name (optional)</label>
          <input class="field" type="text" id="name" placeholder="there">
        </div>
      </div>

      <label for="subject">Subject</label>
      <input class="field" type="text" id="subject" required maxlength="200">

      <label for="body">Message</label>
      <textarea class="field" id="body" required placeholder="Hi there,&#10;&#10;Your message here."></textarea>

      <label for="label">Email label (optional)</label>
      <input class="field" type="text" id="label" placeholder="Caffeine Media" maxlength="60">

      <button class="btn" id="send" type="submit">Send email</button>
      <p id="status" class="status"></p>
    </form>
  </div>
</div>

<script>
const API = "https://maestro-marketplace-api.vercel.app/api/marketplace-admin-email";
const KEY_STORAGE = "cm_admin_key";
let adminKey = null;

function $(id){return document.getElementById(id);}

function showApp(){
  $("login").hidden = true;
  $("app").hidden = false;
}
function showLogin(){
  $("login").hidden = false;
  $("app").hidden = true;
}

let stored = null;
try { stored = sessionStorage.getItem(KEY_STORAGE); } catch (e) { stored = null; }
if (stored) { adminKey = stored; showApp(); }

$("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const pw = $("pw").value;
  if (!pw) return;
  try { sessionStorage.setItem(KEY_STORAGE, pw); } catch (e) {}
  adminKey = pw;
  $("loginStatus").textContent = "";
  showApp();
});

$("signOut").addEventListener("click", function(){
  try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {}
  adminKey = null;
  showLogin();
});

$("compose").addEventListener("submit", async function(e){
  e.preventDefault();
  let key = adminKey;
  if (!key) { try { key = sessionStorage.getItem(KEY_STORAGE); } catch (e) { key = null; } }
  if (!key) key = adminKey;
  const btn = $("send");
  const status = $("status");
  btn.disabled = true;
  status.className = "status";
  status.textContent = "Sending...";
  const payload = {
    key: key,
    from: $("from").value,
    to: $("to").value.trim(),
    name: $("name").value.trim(),
    subject: $("subject").value.trim(),
    body: $("body").value,
    label: $("label").value.trim()
  };
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Key": key },
      body: JSON.stringify(payload)
    });
    const j = await r.json().catch(function(){return {};});
    if (!r.ok) throw new Error(j.error || ("Couldn't send (" + r.status + ")."));
    status.className = "status ok";
    status.textContent = "Sent.";
    $("compose").reset();
  } catch (err) {
    status.className = "status err";
    status.textContent = err.message || "Couldn't send.";
    if (/unauthor/i.test(err.message || "")) {
      try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {}
      showLogin();
    }
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
