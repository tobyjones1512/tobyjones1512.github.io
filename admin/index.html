<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Mail - Caffeine Media</title>
<meta name="theme-color" content="#16110E">
<link rel="icon" href="https://thecaffeinemediacompany.com/assets/favicon.png" type="image/png">
<style>
:root{--ink:#16110E;--paper:#FAFAF7;--field:#F2B705;--red:#C8211A;--dim:#55504B;--rule:#D9D6CE;--card:#FFFFFF;--soft:#F0EDE6;--sidebar:#1E1710}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a{color:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--paper),var(--soft))}
.login form{width:min(400px,100%);background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(22,17,14,.08)}
.login h1{font:800 1.9rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
.login .sub{color:var(--dim);margin:0 0 4px;font-size:.95rem}
.field{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:11px 13px;margin-bottom:2px;transition:border-color .15s}
.field:focus{border-color:var(--ink);outline:none}
.btn{background:var(--ink);color:var(--field);border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn--sm{padding:6px 14px;font-size:.85rem}
.status{min-height:1.4em;margin:6px 0 0;font-weight:600;font-size:.9rem}
.status.ok{color:#1f6b3a}
.status.err{color:var(--red)}

.app{display:grid;grid-template-columns:220px 360px 1fr;height:100vh}
.sidebar{background:var(--sidebar);color:#F3EBDA;padding:20px 14px;display:flex;flex-direction:column;gap:8px}
.sidebar h1{font:800 1.2rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0 0 12px;color:var(--field)}
.mailbox{background:transparent;border:0;color:#F3EBDA;text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;width:100%}
.mailbox:hover{background:rgba(255,255,255,.08)}
.mailbox.active{background:var(--field);color:var(--ink)}
.compose-btn{background:var(--field);color:var(--ink);border:0;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;margin-bottom:12px;width:100%}
.list-pane{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.list-toolbar{padding:12px;border-bottom:1px solid var(--rule);display:flex;gap:8px}
.search{flex:1;padding:8px 10px;border:1px solid var(--rule);border-radius:8px}
.msg-list{flex:1;overflow:auto}
.msg-row{padding:12px 14px;border-bottom:1px solid var(--rule);cursor:pointer}
.msg-row:hover{background:var(--soft)}
.msg-row.active{background:var(--soft);box-shadow:inset 3px 0 var(--field)}
.msg-row.unread .msg-subject{font-weight:800}
.msg-from{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-subject{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-preview{font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg-date{font-size:.75rem;color:var(--dim);margin-top:2px}
.read-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.read-toolbar{padding:12px 16px;border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.read-content{flex:1;overflow:auto;padding:20px 24px}
.read-content .subject{font:800 1.3rem/1.2 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:0 0 8px}
.read-content .meta{font-size:.85rem;color:var(--dim);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.read-content .body{font-size:1rem;line-height:1.6}
.read-content .body img{max-width:100%}
.read-content .attachments{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.read-content .attachments a{display:inline-block;margin:4px 8px 4px 0;padding:6px 12px;border:1px solid var(--rule);border-radius:8px;font-size:.85rem;font-weight:600;text-decoration:none}
.reply-box{padding:16px;border-top:1px solid var(--rule);background:var(--soft)}
.reply-box textarea{width:100%;min-height:100px;border:1px solid var(--rule);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.95rem;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(22,17,14,.5);display:grid;place-items:center;padding:24px;z-index:100}
.modal-card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:24px;width:min(720px,100%);max-height:90vh;overflow:auto;display:grid;gap:12px}
.modal-card h2{font:800 1.2rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
.empty{padding:24px;text-align:center;color:var(--dim)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--paper),var(--soft))}
.login form{width:min(400px,100%);background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(22,17,14,.08)}
.login h1{font:800 1.9rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
.login .sub{color:var(--dim);margin:0 0 4px;font-size:.95rem}
</style>
</head>
<body>

<div id="login" class="login">
  <form id="loginForm">
    <h1>Mail</h1>
    <p class="sub">Caffeine Media</p>
    <label for="pw">Admin password</label>
    <input class="field" type="password" id="pw" autocomplete="current-password" required placeholder="Enter password">
    <button class="btn" type="submit">Sign in</button>
    <p id="loginStatus" class="status err"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="app">
    <div class="sidebar">
      <h1>Mail</h1>
      <button class="compose-btn" id="composeBtn" type="button">Compose</button>
      <button class="mailbox active" data-folder="inbox" type="button">Inbox</button>
      <button class="mailbox" data-folder="sent" type="button">Sent</button>
      <div style="flex:1"></div>
      <button class="btn btn--ghost btn--sm" id="signOut" type="button" onclick="doSignOut()" style="width:100%">Sign out</button>
    </div>
    <div class="list-pane">
      <div class="list-toolbar">
        <input class="search" id="search" placeholder="Search..." type="search">
      </div>
      <div class="msg-list" id="msgList"><div class="empty">Loading...</div></div>
    </div>
    <div class="read-pane">
      <div class="read-toolbar">
        <button class="btn btn--ghost btn--sm" id="deleteBtn" type="button">Delete</button>
        <button class="btn btn--ghost btn--sm" id="markUnreadBtn" type="button">Mark unread</button>
      </div>
      <div class="read-content" id="readContent"><div class="empty">Select a message</div></div>
      <div class="reply-box" id="replyBox" hidden>
        <textarea id="replyBody" placeholder="Reply..."></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button class="btn btn--sm" id="replySend" type="button">Send reply</button>
          <select id="replyFrom" class="field" style="width:auto">
            <option value="hello@thecaffeinemediacompany.com">hello@</option>
            <option value="toby@thecaffeinemediacompany.com">toby@</option>
            <option value="noreply@thecaffeinemediacompany.com">noreply@</option>
          </select>
          <span id="replyStatus" class="status"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Compose modal -->
<div id="composeModal" class="modal" hidden>
  <div class="modal-card">
    <h2>Compose</h2>
    <label for="cFrom">From</label>
    <select class="field" id="cFrom">
      <option value="hello@thecaffeinemediacompany.com">hello@thecaffeinemediacompany.com</option>
      <option value="toby@thecaffeinemediacompany.com">toby@thecaffeinemediacompany.com</option>
      <option value="noreply@thecaffeinemediacompany.com">noreply@thecaffeinemediacompany.com</option>
    </select>
    <label for="cTo">To</label>
    <input class="field" type="text" id="cTo" placeholder="recipient@example.com">
    <div class="row">
      <div><label for="cCc">CC</label><input class="field" type="text" id="cCc"></div>
      <div><label for="cBcc">BCC</label><input class="field" type="text" id="cBcc"></div>
    </div>
    <label for="cSubject">Subject</label>
    <input class="field" type="text" id="cSubject">
    <label for="cBody">Message</label>
    <p style="font-size:.8rem;color:var(--dim);margin:-4px 0 8px">Supports **bold**, *italic*, - bullets, [text](url).</p>
    <textarea class="field" id="cBody" style="min-height:180px"></textarea>
    <label for="cAttachments">Attachments</label>
    <input class="field" type="file" id="cAttachments" multiple>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn--ghost" id="composeCancel" type="button">Cancel</button>
      <button class="btn" id="composeSend" type="button">Send</button>
    </div>
    <p id="composeStatus" class="status"></p>
  </div>
</div>

<script>
const API_BASE = "https://maestro-marketplace-api.vercel.app/api/marketplace-";
const KEY_STORAGE = "cm_admin_key";
let adminKey = null;
let currentFolder = "inbox";
let currentMessageId = null;

function $(id){return document.getElementById(id);}
function apiUrl(name){ return API_BASE + name; }
function doSignOut(){ try { sessionStorage.removeItem(KEY_STORAGE); } catch (e) {} adminKey = null; location.reload(); }
function showApp(){ const login = $("login"); if (login) login.remove(); $("app").hidden = false; }
let stored = null;
try { stored = sessionStorage.getItem(KEY_STORAGE); } catch (e) { stored = null; }
if (stored) { adminKey = stored; showApp(); }
window.addEventListener("pageshow", function(e){ if (e.persisted) location.reload(); });
$("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const pw = $("pw").value;
  if (!pw) return;
  try { sessionStorage.setItem(KEY_STORAGE, pw); } catch (e) {}
  adminKey = pw;
  $("loginStatus").textContent = "";
  showApp();
  loadMessages();
});
$("signOut").addEventListener("click", doSignOut);

function getKey(){ return adminKey || (function(){try{return sessionStorage.getItem(KEY_STORAGE);}catch(e){return null;}})(); }
function authHeaders(){ return { "Content-Type": "application/json", "X-Admin-Key": getKey() || "" }; }

// Mailboxes
document.querySelectorAll(".mailbox").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".mailbox").forEach(function(x){x.classList.remove("active");});
    b.classList.add("active");
    currentFolder = b.getAttribute("data-folder");
    currentMessageId = null;
    $("readContent").innerHTML = '<div class="empty">Select a message</div>';
    $("replyBox").hidden = true;
    loadMessages();
  });
});

async function loadMessages(){
  const list = $("msgList");
  list.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const r = await fetch(apiUrl("mail-list") + "?folder=" + encodeURIComponent(currentFolder) + "&q=" + encodeURIComponent($("search").value.trim()) + "&key=" + encodeURIComponent(getKey()||""));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Failed");
    const msgs = j.messages || [];
    if (!msgs.length) { list.innerHTML = '<div class="empty">No messages</div>'; return; }
    list.innerHTML = msgs.map(function(m){
      return '<div class="msg-row' + (m.id === currentMessageId ? ' active' : '') + (m.read ? '' : ' unread') + '" data-id="' + m.id + '">' +
        '<div class="msg-from">' + (m.from||"") + '</div>' +
        '<div class="msg-subject">' + (m.subject||"") + '</div>' +
        '<div class="msg-preview">' + (m.preview||"") + '</div>' +
        '<div class="msg-date">' + new Date(m.date).toLocaleString() + (m.hasAttachments ? ' · 📎' : '') + '</div>' +
      '</div>';
    }).join("");
    list.querySelectorAll(".msg-row").forEach(function(row){
      row.addEventListener("click", function(){ openMessage(row.getAttribute("data-id")); });
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">' + (e.message||"Error") + '</div>';
  }
}
$("search").addEventListener("input", function(){ clearTimeout(window._st); window._st = setTimeout(loadMessages, 300); });

function attPreview(a){
  const name = a.filename || "file";
  const ct = (a.content_type || "").toLowerCase();
  if (!a.content) return '<a href="#" download="' + name + '">' + name + '</a>';
  const src = "data:" + (a.content_type || "application/octet-stream") + ";base64," + a.content;
  if (ct.startsWith("image/")) return '<div style="margin:8px 0"><img src="' + src + '" alt="' + name + '" style="max-width:100%;border-radius:8px;border:1px solid var(--rule)"><div style="font-size:.75rem;color:var(--dim);margin-top:4px">' + name + '</div></div>';
  if (ct === "application/pdf") return '<div style="margin:8px 0"><embed src="' + src + '" type="application/pdf" width="100%" height="300px" style="border:1px solid var(--rule);border-radius:8px"><div style="font-size:.75rem;color:var(--dim);margin-top:4px">' + name + '</div></div>';
  return '<a href="' + src + '" download="' + name + '">' + name + '</a>';
}

async function openMessage(id){
  currentMessageId = id;
  const view = $("readContent");
  view.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const r = await fetch(apiUrl("mail-message") + "?id=" + encodeURIComponent(id) + "&key=" + encodeURIComponent(getKey()||""));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "Failed");
    const m = j.message;
    let html = '<h2 class="subject">' + (m.subject||"") + '</h2>';
    html += '<div class="meta">From: ' + (m.from||"") + '<br>To: ' + (m.to||"") + (m.cc ? '<br>CC: ' + m.cc : '') + (m.bcc ? '<br>BCC: ' + m.bcc : '') + '<br>Date: ' + new Date(m.date).toLocaleString() + '</div>';
    if (m.html) {
      html += '<div class="body">' + m.html + '</div>';
    } else {
      html += '<div class="body" style="white-space:pre-wrap">' + (m.text||"").replace(/&/g,"&amp;").replace(/</g,"&lt;") + '</div>';
    }
    if (m.attachments && m.attachments.length) {
      html += '<div class="attachments"><strong>Attachments:</strong><br>' + m.attachments.map(attPreview).join("") + '</div>';
    }
    view.innerHTML = html;
    view.querySelectorAll("a").forEach(function(a){ if (!a.getAttribute("target")) a.setAttribute("target","_blank"); a.setAttribute("rel","noopener noreferrer"); });
    $("replyBox").hidden = false;
    loadMessages();
  } catch (e) {
    view.innerHTML = '<div class="empty">' + (e.message||"Error") + '</div>';
    $("replyBox").hidden = true;
  }
}

$("deleteBtn").addEventListener("click", async function(){
  if (!currentMessageId) return;
  if (!confirm("Delete this message?")) return;
  await fetch(apiUrl("mail-delete"), { method: "POST", headers: authHeaders(), body: JSON.stringify({ key: getKey(), id: currentMessageId }) });
  currentMessageId = null;
  $("readContent").innerHTML = '<div class="empty">Select a message</div>';
  $("replyBox").hidden = true;
  loadMessages();
});
$("markUnreadBtn").addEventListener("click", async function(){
  if (!currentMessageId) return;
  await fetch(apiUrl("mail-markread"), { method: "POST", headers: authHeaders(), body: JSON.stringify({ key: getKey(), id: currentMessageId, read: false }) });
  loadMessages();
});

$("replySend").addEventListener("click", async function(){
  const btn = $("replySend");
  const st = $("replyStatus");
  if (!currentMessageId) return;
  btn.disabled = true;
  st.className = "status";
  st.textContent = "Sending...";
  try {
    const r = await fetch(apiUrl("mail-reply"), {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        key: getKey(),
        messageId: currentMessageId,
        from: $("replyFrom").value,
        body: $("replyBody").value
      })
    });
    const j = await r.json().catch(function(){return {};});
    if (!r.ok) throw new Error(j.error || ("Couldn't send (" + r.status + ")."));
    st.className = "status ok";
    st.textContent = "Sent.";
    $("replyBody").value = "";
    loadMessages();
  } catch (err) {
    st.className = "status err";
    st.textContent = err.message || "Couldn't send.";
  } finally {
    btn.disabled = false;
  }
});

// Compose modal
$("composeBtn").addEventListener("click", function(){ $("composeModal").hidden = false; });
$("composeCancel").addEventListener("click", function(){ $("composeModal").hidden = true; });
$("composeSend").addEventListener("click", async function(){
  const btn = $("composeSend");
  const st = $("composeStatus");
  btn.disabled = true;
  st.className = "status";
  st.textContent = "Sending...";
  const attFiles = Array.from($("cAttachments").files || []);
  const attPayload = [];
  for (const f of attFiles) {
    const b64 = await new Promise(function(resolve, reject){
      const r = new FileReader();
      r.onload = function(){ resolve(String(r.result).split(",")[1] || ""); };
      r.onerror = reject;
      r.readAsDataURL(f);
    });
    attPayload.push({ filename: f.name, content: b64, content_type: f.type });
  }
  try {
    const r = await fetch(apiUrl("admin-email"), {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        key: getKey(),
        from: $("cFrom").value,
        to: $("cTo").value.trim(),
        name: "",
        subject: $("cSubject").value.trim(),
        body: $("cBody").value,
        label: "Caffeine Media",
        buttonLabel: "",
        buttonUrl: "",
        cc: $("cCc").value.trim(),
        bcc: $("cBcc").value.trim(),
        attachments: attPayload
      })
    });
    const j = await r.json().catch(function(){return {};});
    if (!r.ok) throw new Error(j.error || ("Couldn't send (" + r.status + ")."));
    st.className = "status ok";
    st.textContent = "Sent.";
    $("cTo").value = ""; $("cCc").value = ""; $("cBcc").value = ""; $("cSubject").value = ""; $("cBody").value = ""; $("cAttachments").value = "";
    $("composeModal").hidden = true;
    if (currentFolder === "sent") loadMessages();
  } catch (err) {
    st.className = "status err";
    st.textContent = err.message || "Couldn't send.";
  } finally {
    btn.disabled = false;
  }
});

// initial
if (stored) { loadMessages(); }
</script>
</body>
</html>
