<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Mail - Caffeine Media</title>
<meta name="theme-color" content="#16110E">
<link rel="icon" href="https://thecaffeinemediacompany.com/assets/favicon.png" type="image/png">
<style>
:root{--ink:#16110E;--paper:#FAFAF7;--field:#F2B705;--red:#C8211A;--dim:#55504B;--rule:#D9D6CE;--card:#FFFFFF;--soft:#F0EDE6;--sidebar:#1E1710;--sidebar-ink:#F3EBDA}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a{color:inherit}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,var(--paper),var(--soft))}
.login form{width:min(400px,100%);background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:32px 28px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(22,17,14,.08)}
.login h1{font:800 1.9rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
.login .sub{color:var(--dim);margin:0 0 4px;font-size:.95rem}

/* Controls */
.field{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;transition:border-color .15s}
.field:focus{border-color:var(--ink);outline:none}
.btn{background:var(--ink);color:var(--field);border:0;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn--sm{padding:6px 13px;font-size:.85rem}
.status{min-height:1.3em;margin:4px 0 0;font-weight:600;font-size:.88rem}
.status.ok{color:#1f6b3a}
.status.err{color:var(--red)}
label{display:block;font:650 .72rem/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;margin:0 0 5px;color:var(--dim)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.row{grid-template-columns:1fr}}

/* Shell */
.app{display:grid;grid-template-columns:216px 350px minmax(0,1fr);height:100vh;height:100dvh}
.sidebar{background:var(--sidebar);color:var(--sidebar-ink);padding:18px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.sidebar h1{font:800 1.15rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:2px 6px 14px;color:var(--field)}
.compose-btn{background:var(--field);color:var(--ink);border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;margin-bottom:10px;width:100%}
.compose-btn:hover{filter:brightness(1.05)}
.mailbox{background:transparent;border:0;color:var(--sidebar-ink);text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600;width:100%;display:flex;justify-content:space-between;gap:8px}
.mailbox:hover{background:rgba(255,255,255,.09)}
.mailbox.active{background:var(--field);color:var(--ink)}
.mailbox .count{font-size:.8rem;opacity:.75}
.sidebar .spacer{flex:1}
.sidebar .btn--ghost{color:var(--sidebar-ink);border-color:rgba(243,235,218,.35)}
.sidebar .btn--ghost:hover{background:rgba(255,255,255,.1);border-color:rgba(243,235,218,.6)}

/* List */
.list-pane{border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;background:var(--paper)}
.list-toolbar{padding:10px 12px;border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
.icon-btn{background:transparent;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700;line-height:1}
.icon-btn:hover{background:var(--soft)}
.msg-list{flex:1;overflow:auto;overscroll-behavior:contain}
.msg-row{padding:11px 14px;border-bottom:1px solid var(--rule);cursor:pointer;background:var(--card)}
.msg-row:hover{background:var(--soft)}
.msg-row.active{background:var(--soft);box-shadow:inset 3px 0 var(--field)}
.msg-row .line1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.msg-from{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-date{font-size:.73rem;color:var(--dim);white-space:nowrap;flex:none}
.msg-subject{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.msg-preview{font-size:.79rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg-row.unread .msg-from,.msg-row.unread .msg-subject{font-weight:800}
.msg-row.unread .msg-from::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--field);margin-right:6px;vertical-align:middle}
.empty{padding:28px 20px;text-align:center;color:var(--dim);font-size:.92rem}

/* Reader */
.read-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--card)}
.read-toolbar{padding:10px 16px;border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:50px}
.read-toolbar .grow{flex:1}
.read-content{flex:1;overflow:auto;padding:22px 26px;overscroll-behavior:contain}
.read-content .subject{font:800 1.28rem/1.25 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.01em;margin:0 0 12px;word-break:break-word}
.read-content .meta{font-size:.84rem;color:var(--dim);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--rule);line-height:1.7;word-break:break-word}
.read-content .meta b{color:var(--ink);font-weight:650}
.mail-frame{width:100%;height:68vh;min-height:380px;border:1px solid var(--rule);border-radius:10px;background:#fff}
.plain-body{white-space:pre-wrap;font-size:1rem;line-height:1.65;word-break:break-word}
.attachments{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.attachments h3{font:700 .78rem/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:0 0 10px}
.att{margin:0 0 12px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.att img{display:block;max-width:100%;max-height:320px;border-radius:8px;margin-bottom:8px}
.att .pdf-frame{width:100%;height:360px;border:1px solid var(--rule);border-radius:8px;margin-bottom:8px;background:#fff}
.att-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.att-row .name{font-weight:650;word-break:break-all;flex:1}
.att-row a{color:var(--red);font-weight:700}

/* Reply */

/* Modal */
.modal{position:fixed;inset:0;background:rgba(22,17,14,.55);display:grid;place-items:center;padding:20px;z-index:100}
.modal-card{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:22px;width:min(980px,100%);max-height:92vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{font:800 1.15rem/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em;margin:0}
.compose-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.compose-grid{grid-template-columns:1fr}}
.compose-form{display:grid;gap:10px;align-content:start}
.compose-form textarea{min-height:190px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.93rem;line-height:1.5}
.hint{font-size:.78rem;color:var(--dim);margin:-6px 0 2px}
.compose-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.preview-wrap{background:var(--soft);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;min-height:240px;align-self:start}
.preview-wrap .pv-h{font:800 1.3rem/1.2 Georgia,'Times New Roman',serif;margin:0 0 10px}
.preview-wrap p{margin:0 0 11px}
.preview-wrap ul{margin:0 0 11px;padding-left:20px}
.preview-wrap li{margin:3px 0}
.preview-wrap a{color:var(--red);font-weight:700}
.preview-wrap .pv-btn{display:inline-block;background:var(--field);color:var(--ink);padding:10px 20px;border-radius:999px;font-weight:700;text-decoration:none;margin:4px 0 10px}
.preview-wrap .pv-foot{margin-top:14px;padding-top:11px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--dim)}
.preview-wrap .pv-sign{margin-top:14px}

/* Toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}

/* Narrow screens: sidebar becomes a top bar */
@media (max-width:860px){
  body{overflow:auto}
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr);height:auto;min-height:100vh}
  .sidebar{flex-direction:row;align-items:center;gap:6px;padding:10px;flex-wrap:wrap}
  .sidebar h1{display:none}
  .sidebar .spacer{flex:0}
  .compose-btn{width:auto;margin:0}
  .sidebar .btn--ghost{width:auto!important}
  .list-pane{border-right:0;border-bottom:1px solid var(--rule);max-height:44vh}
  .read-pane{min-height:60vh}
  .read-content{padding:18px 16px}
  .mail-frame{height:60vh}
}
</style>
</head>
<body>

<div id="login" class="login">
  <form id="loginForm">
    <h1>Mail</h1>
    <p class="sub">Caffeine Media</p>
    <label for="pw">Admin password</label>
    <input class="field" type="password" id="pw" autocomplete="current-password" required placeholder="Enter password">
    <button class="btn" type="submit">Sign in</button>
    <p id="loginStatus" class="status err"></p>
  </form>
</div>

<div id="app" hidden>
  <div class="app">
    <aside class="sidebar">
      <h1>Mail</h1>
      <button class="compose-btn" id="composeBtn" type="button">Compose</button>
      <button class="mailbox active" data-folder="inbox" type="button">Inbox <span class="count" id="inboxCount"></span></button>
      <button class="mailbox" data-folder="sent" type="button">Sent</button>
      <div class="spacer"></div>
      <button class="btn btn--ghost btn--sm" id="signOut" type="button" style="width:100%">Sign out</button>
    </aside>

    <section class="list-pane">
      <div class="list-toolbar">
        <input class="search" id="search" placeholder="Search mail" type="search" autocomplete="off">
        <button class="icon-btn" id="refreshBtn" type="button" title="Refresh" aria-label="Refresh">↻</button>
      </div>
      <div class="msg-list" id="msgList"><div class="empty">Loading…</div></div>
    </section>

    <section class="read-pane">
      <div class="read-toolbar">
        <button class="btn btn--sm" id="replyBtn" type="button" disabled>Reply</button>
        <button class="btn btn--ghost btn--sm" id="deleteBtn" type="button" disabled>Delete</button>
        <button class="btn btn--ghost btn--sm" id="markUnreadBtn" type="button" disabled>Mark unread</button>
        <span class="grow"></span>
        <span id="readerHint" class="status" style="margin:0"></span>
      </div>
      <div class="read-content" id="readContent"><div class="empty">Select a message</div></div>
    </section>
  </div>
</div>

<div id="composeModal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="Compose email">
    <div class="modal-head">
      <h2 id="composeTitle">New message</h2>
      <button class="icon-btn" id="composeClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="compose-grid">
      <div class="compose-form">
        <div>
          <label for="cFrom">From</label>
          <select class="field" id="cFrom">
            <option value="hello@thecaffeinemediacompany.com">hello@thecaffeinemediacompany.com</option>
            <option value="toby@thecaffeinemediacompany.com">toby@thecaffeinemediacompany.com</option>
            <option value="noreply@thecaffeinemediacompany.com">noreply@thecaffeinemediacompany.com</option>
          </select>
        </div>
        <div class="row">
          <div>
            <label for="cTo">To</label>
            <input class="field" type="email" id="cTo" placeholder="recipient@example.com" autocomplete="off">
          </div>
          <div>
            <label for="cName">Recipient name</label>
            <input class="field" type="text" id="cName" placeholder="there" autocomplete="off">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="cCc">CC</label>
            <input class="field" type="text" id="cCc" placeholder="a@x.com, b@y.com" autocomplete="off">
          </div>
          <div>
            <label for="cBcc">BCC</label>
            <input class="field" type="text" id="cBcc" placeholder="a@x.com, b@y.com" autocomplete="off">
          </div>
        </div>
        <div>
          <label for="cSubject">Subject</label>
          <input class="field" type="text" id="cSubject" maxlength="200" autocomplete="off">
        </div>
        <div>
          <label for="cBody">Message</label>
          <p class="hint">**bold**, *italic*, lines starting “- ” for bullets, [text](https://url) for links.</p>
          <textarea class="field" id="cBody" style="min-height:190px" placeholder="Hi there,&#10;&#10;Your message here."></textarea>
        </div>
        <div class="row">
          <div>
            <label for="cButtonLabel">Button label (optional)</label>
            <input class="field" type="text" id="cButtonLabel" maxlength="60" placeholder="Read more" autocomplete="off">
          </div>
          <div>
            <label for="cButtonUrl">Button URL (optional)</label>
            <input class="field" type="url" id="cButtonUrl" placeholder="https://…" autocomplete="off">
          </div>
        </div>
        <div>
          <label for="cLabel">Email label (optional)</label>
          <input class="field" type="text" id="cLabel" maxlength="60" placeholder="Caffeine Media" autocomplete="off">
        </div>
        <div>
          <label for="cAttachments">Attachments</label>
          <input class="field" type="file" id="cAttachments" multiple>
          <p class="hint" id="cAttachList">No files selected.</p>
        </div>
        <div class="compose-actions">
          <button class="btn" id="composeSend" type="button">Send email</button>
          <button class="btn btn--ghost" id="openClient" type="button">Open in email client</button>
          <button class="btn btn--ghost" id="composeCancel" type="button">Cancel</button>
        </div>
        <p id="composeStatus" class="status"></p>
      </div>
      <div class="preview-wrap" id="composePreview"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const API_BASE = "https://maestro-marketplace-api.vercel.app/api/marketplace-";
const KEY_STORAGE = "cm_admin_key";
let adminKey = null;
let currentFolder = "inbox";
let currentMessageId = null;
let currentMessage = null;
let composeInReplyTo = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmtDate(d){ const t = new Date(d); return isNaN(t) ? "" : t.toLocaleString([], { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }); }
function fmtFullDate(d){ const t = new Date(d); return isNaN(t) ? "" : t.toLocaleString(); }

function getKey(){ return adminKey || (function(){ try { return sessionStorage.getItem(KEY_STORAGE); } catch(e){ return null; } })(); }
function authHeaders(){ return { "Content-Type": "application/json", "X-Admin-Key": getKey() || "" }; }

function doSignOut(){
  try { sessionStorage.removeItem(KEY_STORAGE); } catch(e){}
  adminKey = null;
  location.reload();
}

function toast(msg, isErr){
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(window._toastT);
  window._toastT = setTimeout(function(){ el.className = "toast"; }, 3200);
}

function showApp(){
  const login = $("login");
  if (login) login.remove();
  $("app").hidden = false;
}

async function handleResponse(r){
  let j = {};
  try { j = await r.json(); } catch(e){}
  if (r.status === 401) { doSignOut(); throw new Error("Session expired. Sign in again."); }
  if (!r.ok) throw new Error(j.error || ("Request failed (" + r.status + ")."));
  return j;
}
async function apiGet(name, params){
  const qs = params ? "?" + new URLSearchParams(params).toString() : "";
  return handleResponse(await fetch(API_BASE + name + qs, { headers: { "X-Admin-Key": getKey() || "" } }));
}
async function apiPost(name, payload){
  return handleResponse(await fetch(API_BASE + name, { method: "POST", headers: authHeaders(), body: JSON.stringify(payload) }));
}

/* ---------- Auth ---------- */
let stored = null;
try { stored = sessionStorage.getItem(KEY_STORAGE); } catch(e){ stored = null; }
if (stored) { adminKey = stored; showApp(); }

window.addEventListener("pageshow", function(e){ if (e.persisted) location.reload(); });

$("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const pw = $("pw").value;
  if (!pw) return;
  const btn = $("loginForm").querySelector("button[type=submit]");
  btn.disabled = true;
  $("loginStatus").textContent = "";
  try {
    const r = await fetch(API_BASE + "mail-list?folder=inbox", { headers: { "X-Admin-Key": pw } });
    if (!r.ok) throw new Error(r.status === 401 ? "Wrong password." : "Could not sign in (" + r.status + ").");
    adminKey = pw;
    try { sessionStorage.setItem(KEY_STORAGE, pw); } catch(e){}
    showApp();
    bootMail();
  } catch (err) {
    adminKey = null;
    $("loginStatus").textContent = err.message || "Could not sign in.";
  } finally {
    btn.disabled = false;
  }
});
$("signOut").addEventListener("click", doSignOut);

/* ---------- Folder switching ---------- */
document.querySelectorAll(".mailbox").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".mailbox").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    currentFolder = b.getAttribute("data-folder");
    clearReader();
    loadMessages();
  });
});

/* ---------- Message list ---------- */
async function loadMessages(){
  const list = $("msgList");
  list.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const j = await apiGet("mail-list", { folder: currentFolder, q: $("search").value.trim() });
    const msgs = j.messages || [];
    if (currentFolder === "inbox") {
      const unread = msgs.filter(function(m){ return !m.read; }).length;
      $("inboxCount").textContent = unread ? String(unread) : "";
    } else {
      $("inboxCount").textContent = "";
    }
    if (!msgs.length) {
      list.innerHTML = '<div class="empty">' + (currentFolder === "inbox" ? "Inbox is empty" : "Nothing in Sent") + "</div>";
      return;
    }
    list.innerHTML = msgs.map(function(m){
      return '<div class="msg-row' + (m.id === currentMessageId ? " active" : "") + (m.read ? "" : " unread") + '" data-id="' + esc(m.id) + '">' +
        '<div class="line1"><span class="msg-from">' + esc(m.from || "(unknown)") + '</span><span class="msg-date">' + esc(fmtDate(m.date)) + "</span></div>" +
        '<div class="msg-subject">' + esc(m.subject || "(no subject)") + (m.hasAttachments ? " · 📎" : "") + "</div>" +
        '<div class="msg-preview">' + esc(m.preview || "") + "</div>" +
      "</div>";
    }).join("");
    list.querySelectorAll(".msg-row").forEach(function(row){
      row.addEventListener("click", function(){ openMessage(row.getAttribute("data-id")); });
    });
  } catch (e) {
    list.innerHTML = '<div class="empty">' + esc(e.message || "Could not load mail") + "</div>";
  }
}

let searchTimer = null;
$("search").addEventListener("input", function(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadMessages, 250);
});
$("refreshBtn").addEventListener("click", function(){
  loadMessages();
  if (currentMessageId) openMessage(currentMessageId, true);
});

/* ---------- Reader ---------- */
function setToolbar(enabled){
  $("deleteBtn").disabled = !enabled;
  $("markUnreadBtn").disabled = !enabled;
  $("replyBtn").disabled = !enabled || !currentMessage || currentMessage.folder !== "inbox";
}
function clearReader(){
  currentMessageId = null;
  currentMessage = null;
  $("readContent").innerHTML = '<div class="empty">Select a message</div>';
  $("readerHint").textContent = "";
  setToolbar(false);
}

function renderAttachment(a){
  const wrap = document.createElement("div");
  wrap.className = "att";
  const name = a.filename || "attachment";
  const ct = String(a.content_type || "").toLowerCase();
  const hasContent = !!a.content;
  const src = hasContent ? "data:" + (a.content_type || "application/octet-stream") + ";base64," + a.content : "";

  if (hasContent && ct.indexOf("image/") === 0) {
    const img = document.createElement("img");
    img.src = src;
    img.alt = name;
    wrap.appendChild(img);
  }
  if (hasContent && ct === "application/pdf") {
    const fr = document.createElement("iframe");
    fr.className = "pdf-frame";
    fr.src = src;
    fr.title = name;
    wrap.appendChild(fr);
  }
  const row = document.createElement("div");
  row.className = "att-row";
  const label = document.createElement("span");
  label.className = "name";
  label.textContent = name;
  row.appendChild(label);
  if (hasContent) {
    const open = document.createElement("a");
    open.href = src;
    open.target = "_blank";
    open.rel = "noopener noreferrer";
    open.textContent = ct === "application/pdf" ? "Open PDF" : "Open";
    row.appendChild(open);
    const dl = document.createElement("a");
    dl.href = src;
    dl.download = name;
    dl.textContent = "Download";
    row.appendChild(dl);
  } else {
    const missing = document.createElement("span");
    missing.textContent = "Not downloaded";
    missing.style.color = "var(--dim)";
    row.appendChild(missing);
  }
  wrap.appendChild(row);
  return wrap;
}

async function openMessage(id, quiet){
  currentMessageId = id;
  const view = $("readContent");
  if (!quiet) view.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const j = await apiGet("mail-message", { id: id });
    const m = j.message;
    currentMessage = m;
    view.textContent = "";

    const h = document.createElement("h2");
    h.className = "subject";
    h.textContent = m.subject || "(no subject)";
    view.appendChild(h);

    const meta = document.createElement("div");
    meta.className = "meta";
    const rows = [["From", m.from], ["To", m.to], ["CC", m.cc], ["BCC", m.bcc], ["Date", fmtFullDate(m.date)]];
    rows.forEach(function(pair){
      if (!pair[1]) return;
      const line = document.createElement("div");
      const b = document.createElement("b");
      b.textContent = pair[0] + ": ";
      line.appendChild(b);
      line.appendChild(document.createTextNode(String(pair[1])));
      meta.appendChild(line);
    });
    view.appendChild(meta);

    if (m.html) {
      const frame = document.createElement("iframe");
      frame.className = "mail-frame";
      frame.setAttribute("sandbox", "allow-popups allow-popups-to-escape-sandbox");
      frame.setAttribute("referrerpolicy", "no-referrer");
      frame.srcdoc = m.html;
      view.appendChild(frame);
    } else {
      const pre = document.createElement("div");
      pre.className = "plain-body";
      pre.textContent = m.text || "(no message body)";
      view.appendChild(pre);
    }

    if (Array.isArray(m.attachments) && m.attachments.length) {
      const box = document.createElement("div");
      box.className = "attachments";
      const t = document.createElement("h3");
      t.textContent = "Attachments (" + m.attachments.length + ")";
      box.appendChild(t);
      m.attachments.forEach(function(a){ box.appendChild(renderAttachment(a)); });
      view.appendChild(box);
    }

    setToolbar(true);
    $("readerHint").textContent = "";
    if (!quiet) loadMessages();
  } catch (e) {
    view.innerHTML = '<div class="empty">' + esc(e.message || "Could not open message") + "</div>";
    setToolbar(false);
    if (!/session expired/i.test(e.message || "")) $("readerHint").textContent = "";
  }
}

$("deleteBtn").addEventListener("click", async function(){
  if (!currentMessageId) return;
  if (!confirm("Delete this message?")) return;
  try {
    await apiPost("mail-delete", { id: currentMessageId });
    toast("Message deleted");
    clearReader();
    loadMessages();
  } catch (e) { toast(e.message || "Could not delete", true); }
});

$("markUnreadBtn").addEventListener("click", async function(){
  if (!currentMessageId) return;
  try {
    await apiPost("mail-markread", { id: currentMessageId, read: false });
    loadMessages();
    toast("Marked as unread");
  } catch (e) { toast(e.message || "Could not update", true); }
});

/* ---------- Reply ---------- */
function addrOnly(value){
  const m = /<([^<>\s]+@[^<>\s]+)>/.exec(String(value || ""));
  if (m) return m[1];
  const e = String(value || "").match(/[^\s@<>,;]+@[^\s@<>,;]+\.[^\s@<>,;]+/);
  return e ? e[0] : "";
}
function displayName(value){
  const s = String(value || "");
  const m = /^\s*"?([^"<]+?)"?\s*</.exec(s);
  if (m && m[1].trim()) return m[1].trim().replace(/^["']|["']$/g, "");
  const local = addrOnly(s).split("@")[0];
  return local && /^[a-z0-9._%+-]+$/i.test(local) ? local.charAt(0).toUpperCase() + local.slice(1) : "";
}
function ourMailbox(value){
  const lc = String(value || "").toLowerCase();
  if (lc.indexOf("toby@thecaffeinemediacompany.com") !== -1) return "toby@thecaffeinemediacompany.com";
  if (lc.indexOf("noreply@thecaffeinemediacompany.com") !== -1) return "noreply@thecaffeinemediacompany.com";
  return "hello@thecaffeinemediacompany.com";
}

function startReply(){
  if (!currentMessage || currentMessage.folder !== "inbox") return;
  const m = currentMessage;
  composeInReplyTo = m.id;
  $("cTo").value = addrOnly(m.from);
  $("cName").value = displayName(m.from);
  $("cSubject").value = /^\s*re\s*:/i.test(m.subject || "") ? (m.subject || "") : "Re: " + (m.subject || "");
  $("cBody").value = "";
  $("cFrom").value = ourMailbox(m.to);
  // Carry over any other original CC recipients, minus our own addresses.
  const ccList = (String(m.cc || "").match(/[^\s@<>,;]+@[^\s@<>,;]+\.[^\s@<>,;]+/g) || [])
    .filter(function(a){ return !/^[^@]+@thecaffeinemediacompany\.com$/i.test(a); });
  $("cCc").value = ccList.join(", ");
  $("cBcc").value = "";
  $("cButtonLabel").value = "";
  $("cButtonUrl").value = "";
  $("cLabel").value = "";
  $("cAttachments").value = "";
  $("cAttachList").textContent = "No files selected.";
  openCompose();
}
$("replyBtn").addEventListener("click", startReply);

/* ---------- Compose ---------- */
function openCompose(){
  $("composeStatus").textContent = "";
  $("composeTitle").textContent = composeInReplyTo ? "Reply" : "New message";
  $("composeModal").hidden = false;
  renderComposePreview();
  setTimeout(function(){ (composeInReplyTo ? $("cBody") : $("cTo")).focus(); }, 30);
}
function newCompose(){
  composeInReplyTo = null;
  $("cTo").value = ""; $("cCc").value = ""; $("cBcc").value = ""; $("cName").value = "";
  $("cSubject").value = ""; $("cBody").value = ""; $("cButtonLabel").value = ""; $("cButtonUrl").value = "";
  $("cLabel").value = ""; $("cAttachments").value = ""; $("cAttachList").textContent = "No files selected.";
  openCompose();
}
function closeCompose(){ $("composeModal").hidden = true; }

function inlineMd(text){
  return esc(text)
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>")
    .replace(/_([^_\n]+)_/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\s*\(([^)]+)\)/g, function(m, txt, url){
      const clean = url.trim();
      if (!/^https?:\/\//i.test(clean)) return txt;
      return '<a href="' + esc(clean) + '" target="_blank" rel="noopener noreferrer">' + txt + "</a>";
    });
}

function renderComposePreview(){
  const body = $("cBody").value;
  const name = $("cName").value.trim() || "there";
  const from = $("cFrom").value;
  const btnLabel = $("cButtonLabel").value.trim();
  const btnUrl = $("cButtonUrl").value.trim();
  const label = $("cLabel").value.trim();
  let html = '<div class="pv-h">Caffeine Media</div>';
  html += '<p><strong>Hi ' + esc(name) + ",</strong></p>";

  const lines = body.split("\n");
  let inList = false;
  lines.forEach(function(raw){
    const line = raw.trim();
    if (!line) { if (inList) { html += "</ul>"; inList = false; } return; }
    const m = /^[-*]\s+(.*)$/.exec(line);
    if (m) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += "<li>" + inlineMd(m[1]) + "</li>";
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      html += "<p>" + inlineMd(line) + "</p>";
    }
  });
  if (inList) html += "</ul>";

  if (btnLabel && btnUrl && /^https?:\/\//i.test(btnUrl)) {
    html += '<a class="pv-btn" href="' + esc(btnUrl) + '" target="_blank" rel="noopener noreferrer">' + esc(btnLabel) + "</a>";
  }

  const signoff = from === "toby@thecaffeinemediacompany.com" ? "Toby Jones" : "The Caffeine Media Company";
  html += '<p class="pv-sign">Best regards,<br><strong>' + esc(signoff) + "</strong></p>";
  if (from === "noreply@thecaffeinemediacompany.com") {
    html += '<div class="pv-foot">This mailbox is not monitored.</div>';
  } else {
    html += '<div class="pv-foot">The Caffeine Media Company · thecaffeinemediacompany.com' + (label ? " · " + esc(label) : "") + "</div>";
  }
  const atts = Array.from($("cAttachments").files || []);
  if (atts.length) html += '<div class="pv-foot">Attachments: ' + esc(atts.map(function(f){ return f.name; }).join(", ")) + "</div>";

  $("composePreview").innerHTML = html;
}

["cBody","cFrom","cName","cButtonLabel","cButtonUrl","cLabel"].forEach(function(id){
  const el = $(id);
  if (el) { el.addEventListener("input", renderComposePreview); el.addEventListener("change", renderComposePreview); }
});
$("cAttachments").addEventListener("change", function(){
  const fs = Array.from($("cAttachments").files || []);
  $("cAttachList").textContent = fs.length
    ? fs.map(function(f){ return f.name + " (" + Math.max(1, Math.round(f.size / 1024)) + " KB)"; }).join(", ")
    : "No files selected.";
  renderComposePreview();
});

$("composeBtn").addEventListener("click", newCompose);
$("composeClose").addEventListener("click", closeCompose);
$("composeCancel").addEventListener("click", closeCompose);
$("composeModal").addEventListener("click", function(e){ if (e.target === $("composeModal")) closeCompose(); });
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !$("composeModal").hidden) closeCompose();
});

$("openClient").addEventListener("click", function(){
  const to = $("cTo").value.trim();
  const cc = $("cCc").value.trim();
  const bcc = $("cBcc").value.trim();
  const subject = $("cSubject").value.trim();
  const body = $("cBody").value;
  if (!to) { toast("Add a recipient first", true); return; }
  const parts = [];
  if (cc) parts.push("cc=" + encodeURIComponent(cc));
  if (bcc) parts.push("bcc=" + encodeURIComponent(bcc));
  if (subject) parts.push("subject=" + encodeURIComponent(subject));
  if (body) parts.push("body=" + encodeURIComponent(body));
  window.location.href = "mailto:" + encodeURIComponent(to) + (parts.length ? "?" + parts.join("&") : "");
});

function readFileBase64(file){
  return new Promise(function(resolve, reject){
    const r = new FileReader();
    r.onload = function(){ resolve(String(r.result).split(",")[1] || ""); };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

$("composeSend").addEventListener("click", async function(){
  const btn = $("composeSend");
  const st = $("composeStatus");
  const to = $("cTo").value.trim();
  const subject = $("cSubject").value.trim();
  const body = $("cBody").value;
  if (!/^[^\s@<>,;]+@[^\s@<>,;]+\.[^\s@<>,;]+$/.test(to)) { st.className = "status err"; st.textContent = "Enter a valid recipient address."; return; }
  if (!subject) { st.className = "status err"; st.textContent = "Enter a subject."; return; }
  if (!body.trim()) { st.className = "status err"; st.textContent = "Write a message."; return; }

  btn.disabled = true;
  st.className = "status";
  st.textContent = "Sending…";
  try {
    const attFiles = Array.from($("cAttachments").files || []);
    const attPayload = [];
    for (const f of attFiles) {
      const b64 = await readFileBase64(f);
      attPayload.push({ filename: f.name, content: b64, content_type: f.type });
    }
    await apiPost("admin-email", {
      from: $("cFrom").value,
      to: to,
      name: $("cName").value.trim(),
      subject: subject,
      body: body,
      label: $("cLabel").value.trim(),
      buttonLabel: $("cButtonLabel").value.trim(),
      buttonUrl: $("cButtonUrl").value.trim(),
      cc: $("cCc").value.trim(),
      bcc: $("cBcc").value.trim(),
      attachments: attPayload,
      inReplyTo: composeInReplyTo || ""
    });
    $("cTo").value = ""; $("cCc").value = ""; $("cBcc").value = ""; $("cName").value = "";
    $("cSubject").value = ""; $("cBody").value = ""; $("cButtonLabel").value = ""; $("cButtonUrl").value = "";
    $("cLabel").value = ""; $("cAttachments").value = ""; $("cAttachList").textContent = "No files selected.";
    const wasReply = !!composeInReplyTo;
    composeInReplyTo = null;
    closeCompose();
    toast(wasReply ? "Reply sent" : "Email sent");
    if (currentFolder === "sent") loadMessages();
  } catch (e) {
    st.className = "status err";
    st.textContent = e.message || "Couldn't send.";
  } finally {
    btn.disabled = false;
  }
});

/* ---------- Boot ---------- */
async function bootMail(){
  await loadMessages();
  const id = new URLSearchParams(location.search).get("message");
  if (id) openMessage(id);
}
if (stored) bootMail();
